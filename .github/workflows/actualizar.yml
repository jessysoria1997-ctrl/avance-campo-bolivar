name: Actualizar tablero desde Kobo

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # cada 15 minutos (GitHub puede demorarlo unos minutos)
  workflow_dispatch: {}       # botón "Run workflow" para actualizar al instante

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Descargar encuestas de Kobo
        env:
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_URL: ${{ vars.KOBO_URL }}
          META: ${{ vars.META }}
        run: python scripts/actualizar_kobo.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  publicar:
    needs: construir
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v4
